<!-- webserver/templates/index.html -->
<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Drohnenmission starten</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet">
	</head>
	<body class="bg-light">
		<div class="container my-5">
			<div class="card shadow-sm">
				<div class="card-body">
					<h2 class="card-title mb-4">Drohnenmission starten</h2>
					<form method="POST">
						<!-- Mission Dropdown -->
						<div class="row mb-3">
							<label for="mission" class="col-sm-4 col-form-label">Mission</label>
							<div class="col-sm-8">
								<select class="form-select" id="mission" name="mission" required>
									<option value>Bitte auswählen</option>
									<option value="1">Mission 1 – Kartierung</option>
									<option value="2">Mission 2 – Präzisionslandung</option>
									<option value="3">Mission 3 – Multi-Target</option>
								</select>
							</div>
						</div>
						<!-- Landing Position Input -->
						<div class="row mb-3">
							<label for="landingPosition"
								class="col-sm-4 col-form-label">Landeposition (LAT,LONG)</label>
							<div class="col-sm-8">
								<input type="text" class="form-control" id="landingPosition"
									name="landingPosition" placeholder="z.B. 48.12345,11.12345" required>
							</div>
						</div>
						<!-- Target Type Dropdown -->
						<div class="row mb-3">
							<label for="targetType" class="col-sm-4 col-form-label">Target Typ
								(Mission 1 und 2)</label>
							<div class="col-sm-8">
								<select class="form-select" id="targetType" name="targetType">
									<option value>Bitte auswählen (nur für Mission 1 und 2)</option>
									<option value="red">Rot</option>
									<option value="yellow">Gelb</option>
									<option value="blue">Blau</option>
									<option value="orange">Orange</option>
								</select>
							</div>
						</div>
						<!-- Weather conditions Dropdown -->
						<div class="row mb-3">
							<label for="weatherConditions" class="col-sm-4 col-form-label">Wetterbedingungen</label>
							<div class="col-sm-8">
								<select class="form-select" id="weatherConditions" name="weatherConditions" required>
									<option value>Bitte auswählen</option>
									<option value="sunny">Sonnig</option>
									<option value="cloudy">Bewölkt</option>
								</select>
							</div>
						</div>
						<!-- Area Textarea -->
						<div class="row mb-3">
							<label for="area" class="col-sm-4 col-form-label">Suchgebiet (Mission
								1)</label>
							<div class="col-sm-8">
								<textarea class="form-control" id="area" name="area" rows="3"
									placeholder="Jede Zeile: z.B. 48.12345,11.12345&#10;(nur für Mission 1)"></textarea>
							</div>
						</div>
						<!-- Waypoints Textarea -->
						<div class="row mb-3">
							<label for="waypoints" class="col-sm-4 col-form-label">Wegpunkte (Mission 1)</label>
							<div class="col-sm-8">
								<textarea class="form-control" id="waypoints" name="waypoints" rows="3"
									placeholder="Jede Zeile: z.B. 48.12345,11.12345&#10;(nur für Mission 1)"></textarea>
							</div>
						</div>
						<!-- Geofence Textarea -->
						<div class="row mb-3">
							<label for="geofence" class="col-sm-4 col-form-label">Geofence</label>
							<div class="col-sm-8">
								<textarea class="form-control" id="geofence" name="geofence" rows="3"
									placeholder="Jede Zeile: z.B. 48.12345,11.12345 (optional)"></textarea>
							</div>
						</div>
						<!-- Target Number Input -->
						<div class="row mb-3">
							<label for="targetNumber" class="col-sm-4 col-form-label">Zielanzahl
								(Mission 3)</label>
							<div class="col-sm-8">
								<input type="number" class="form-control" id="targetNumber"
									name="targetNumber" placeholder="z.B. 5 (nur für Mission 3)">
							</div>
						</div>
						<div class="row mb-3">
							<div class="offset-sm-4 col-sm-8">
								<button type="submit" class="btn btn-primary">Mission starten</button>
							</div>
						</div>
					</form>

					{% if output %}
					<div class="mt-4">
						<h4>Output</h4>
						<pre>{{ output }}</pre>
					</div>
					{% endif %}

					<div class="mt-4">
						<h4>Live Log</h4>
						<pre id="log">Lade Log...</pre>
					</div>
				</div>
			</div>
		</div>

		<script>
			function fetchLogs() {
				mission = document.getElementById("mission").value;
				if (!mission) {
					document.getElementById("log").textContent = "Bitte wählen Sie eine Mission aus.";
					return;
				}
				fetch(`/logs/mission${mission}`)
				.then(response => response.text())
				.then(text => {
					document.getElementById("log").textContent = text;
				});
			}
			setInterval(fetchLogs, 100);
			fetchLogs();
		</script>
	</body>
</html>
