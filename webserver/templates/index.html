<!-- webserver/templates/index.html -->
<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>Drohnenmission starten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">

    <div class="container mt-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-4">Drohnenmission starten</h2>
          <form method="POST">
            <!-- Mission Dropdown -->
            <div class="mb-3">
              <label for="mission" class="form-label">Mission</label>
              <select class="form-select" id="mission" name="mission" required>
                <option value="">Bitte auswählen</option>
                <option value="1">Mission 1 – Kartierung</option>
                <option value="2">Mission 2 – Präzisionslandung</option>
                <option value="3">Mission 3 – Multi-Target</option>
              </select>
            </div>

            <!-- Landing Position Input -->
            <div class="mb-3">
              <label for="landingPosition" class="form-label">Landeposition (LAT,LONG)</label>
              <input type="text" class="form-control" id="landingPosition" name="landingPosition" placeholder="z.B. 48.12345,11.12345" required>
            </div>

            <!-- Target Type Dropdown -->
            <div class="mb-3">
              <label for="targetType" class="form-label">Target Typ</label>
              <select class="form-select" id="targetType" name="targetType">
                <option value="">Bitte auswählen (nur für Mission 1 und 2)</option>
                <option value="red">Rot</option>
                <option value="yellow">Gelb</option>
                <option value="blue">Blau</option>
              </select>
            </div>

            <!-- Area Textarea -->
            <div class="mb-3">
              <label for="area" class="form-label">Suchgebiet (Liste der Eckpunkte: LAT,LONG)</label>
              <textarea class="form-control" id="area" name="area" rows="3" placeholder="Jede Zeile: z.B. 48.12345,11.12345&#10;(nur für Mission 1)"></textarea>
            </div>

            <!-- Geofence Textarea -->
            <div class="mb-3">
              <label for="geofence" class="form-label">Geofence (Liste der Eckpunkte: LAT,LONG)</label>
              <textarea class="form-control" id="geofence" name="geofence" rows="3" placeholder="Jede Zeile: z.B. 48.12345,11.12345 (optional)"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Mission starten</button>
          </form>
        </div>
      </div>
    </div>

  </body>
</html>
